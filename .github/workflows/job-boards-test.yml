name: Job boards test

# Quick check of what each job board returns to a headless browser on GitHub's
# servers: one search per site, verbose log, nothing saved or published.
on:
  workflow_dispatch:
  push:
    paths:
      - "collector/wtwn/jobscrape.py"
      - ".github/workflows/job-boards-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python -m playwright install --with-deps --only-shell chromium
      - name: Scrape one search per site
        working-directory: collector
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -m wtwn.jobscrape --test --out "$RUNNER_TEMP/jobs.json"
