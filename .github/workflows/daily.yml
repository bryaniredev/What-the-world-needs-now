name: Daily run + publish

on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC
  workflow_dispatch:         # "Run workflow" button for an on-demand run
  push:
    paths:
      - "docs/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Also lets the job read SITE_PASSPHRASE if it was saved as a github-pages environment secret.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      # Reports only true/false, never the value.
      - name: Check passphrase secret
        env:
          HAS_SECRET: ${{ secrets.SITE_PASSPHRASE != '' }}
          HAS_VARIABLE: ${{ vars.SITE_PASSPHRASE != '' }}
        run: |
          echo "SITE_PASSPHRASE visible as an Actions secret: $HAS_SECRET"
          echo "SITE_PASSPHRASE found as an Actions *variable* (wrong tab): $HAS_VARIABLE"
          if [ "$HAS_SECRET" != "true" ]; then
            if [ "$HAS_VARIABLE" = "true" ]; then
              echo "::error::SITE_PASSPHRASE was saved on the Variables tab. Delete it there and add it on the Secrets tab (Settings > Secrets and variables > Actions > Secrets > New repository secret)."
            else
              echo "::error::No SITE_PASSPHRASE secret is visible to this workflow. Add it under Settings > Secrets and variables > ACTIONS (not Codespaces or Dependabot) > Secrets tab > New repository secret, named exactly SITE_PASSPHRASE."
            fi
            exit 1
          fi

      # Scheduled and manual runs always collect. A push only collects when there is
      # no data yet, so the very first push bootstraps the site.
      - id: gate
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ ! -f docs/data/meta.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Install headless browser
        if: steps.gate.outputs.run == 'true'
        run: python -m playwright install --with-deps --only-shell chromium

      # Never fails the run: a site that blocks the browser is just recorded as blocked.
      - name: Scrape job boards
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 30
        working-directory: collector
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -m wtwn.jobscrape --out "$RUNNER_TEMP/jobs.json"

      - name: Collect, analyse, encrypt
        if: steps.gate.outputs.run == 'true'
        working-directory: collector
        env:
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOBS_SCRAPE_FILE: ${{ runner.temp }}/jobs.json
        run: python -m wtwn.run

      - name: Commit results
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then
            echo "Nothing new to commit"; exit 0
          fi
          git commit -m "Daily run $(date -u +%F)"
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $((i * 5)); git pull --rebase
          done
          exit 1

  deploy:
    needs: collect
    if: always() && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # pick up the commit the collect job just pushed
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turn Pages on (source: GitHub Actions) if it isn't yet
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
