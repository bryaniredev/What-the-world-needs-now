name: Backfill history

# Rebuilds past weeks from the archive, then runs the current week with every source.
# Takes one to two hours. Start it from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "How many past weeks to rebuild"
        default: "13"
      reset:
        description: "Delete the existing history first (otherwise weeks already present are kept)"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/backfill.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-run          # never at the same time as the weekly run
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: github-pages   # where the SITE_PASSPHRASE secret is saved
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Backfill
        working-directory: collector
        env:
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
          WEEKS: ${{ inputs.weeks || '13' }}
          RESET: ${{ github.event_name == 'push' || inputs.reset }}
        run: |
          if [ "$RESET" = "true" ]; then python -m wtwn.backfill --weeks "$WEEKS" --reset; else python -m wtwn.backfill --weeks "$WEEKS"; fi

      # Runs even if the step above stopped early, so finished weeks are kept and a re-run resumes.
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data state
          if git diff --cached --quiet; then
            echo "Nothing new to commit"; exit 0
          fi
          git commit -m "Backfill history $(date -u +%F)"
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $((i * 5)); git pull --rebase
          done
          exit 1

  deploy:
    needs: backfill
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
